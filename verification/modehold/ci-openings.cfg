  Rooms = 2
  WithVote = TRUE
  WithSelect = TRUE
  WithReload = FALSE
  WithRestart = FALSE
  WithCrash = FALSE
  WithOpenings = TRUE
INVARIANTS
  TypeOK
  HoldKept
  NoExtraWait
  NeverLonger
  FreshNoWait
  PausedRunKept
  PausedNeverVotes
  PauseKeepsHold
  OverrideNeverPaused
  PauseKeepsMode
