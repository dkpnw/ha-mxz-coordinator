name: Quality

# Separate from ci.yml, whose exact job set tests/test_ci_contract.py fixes.
# tests/test_tooling_contract.py holds this file's boundaries.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage (py3.14-ha2026.9.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Exact locked installation
        run: |
          tools/ci-install.sh requirements/constraints-py314-ha2026.9.4.txt cf85bc927e5bb618e56290212c27ed49bf0b4b89b523adbe23430cd309e484f3 3.14 > "$RUNNER_TEMP/install.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/install.log"; exit 1; }
      # pyproject.toml holds what is measured and the floor; below it, pytest exits non-zero.
      - name: Full suite with the coverage floor
        run: |
          source "$RUNNER_TEMP/mxz-venv/bin/activate"
          python -m pytest -p tools.pytest_phases tests/ -q --cov --cov-report=term

  mypy:
    name: mypy (py3.14-ha2026.9.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Exact locked installation
        run: |
          tools/ci-install.sh requirements/constraints-py314-ha2026.9.4.txt cf85bc927e5bb618e56290212c27ed49bf0b4b89b523adbe23430cd309e484f3 3.14 > "$RUNNER_TEMP/install.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/install.log"; exit 1; }
      # Its own environment: tools/check_lock.py holds the lane to exactly its lock.
      - name: Pinned mypy
        run: |
          python -m venv "$RUNNER_TEMP/mypy-venv"
          "$RUNNER_TEMP/mypy-venv/bin/python" -m pip install --require-hashes -r requirements_ci.txt
      - name: Strict type check against the lane's Home Assistant
        run: '"$RUNNER_TEMP/mypy-venv/bin/mypy" --python-executable "$RUNNER_TEMP/mxz-venv/bin/python"'
