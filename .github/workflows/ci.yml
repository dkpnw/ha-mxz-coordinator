name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run. Any other run is
# its own group (a shared group would cancel a pending run), so every commit on main
# gets a complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master as of 2026-10-26

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a main commit, not a release tag: the old HACS tag is not its current ruleset.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main as of 2026-06-08
        with:
          category: integration
          # Brand icons ship locally; the brands check runs with no ignore.

  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - run: pip install --require-hashes -r requirements_ci.txt
      - run: ruff check .

  yamllint:
    name: yamllint (legacy package)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --require-hashes -r requirements_ci.txt
      - run: yamllint -c .yamllint packages/ examples/

  # One job per lane: the lane's lock, the full suite, then the full suite again on a
  # fresh-boot clock. A lane is one lock file in requirements/ and one row here.
  # Each pass runs on every CPU (pytest-xdist, which every lane's test plugin installs).
  # --dist loadfile keeps each file's tests in one worker, in file order, as a serial
  # run has them. Run one test at a time, a pass took up to 595 s on slow hosted runners
  # (Nov 2026, 4,156 tests); 45 minutes holds both passes even at that pace, plus the
  # install.
  pytest:
    name: pytest (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: py3.12-ha2024.12.5
            python-version: "3.12.14"
            constraints: requirements/constraints-py312-ha2024.12.5.txt
          - lane: py3.13-ha2026.2.3
            python-version: "3.13"
            constraints: requirements/constraints-py313-ha2026.2.3.txt
          - lane: py3.14-ha2026.9.4
            python-version: "3.14"
            constraints: requirements/constraints-py314-ha2026.9.4.txt
          - lane: py3.14-ha2026.10.4
            python-version: "3.14"
            constraints: requirements/constraints-py314-ha2026.10.4.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the lane's lock
        run: tools/ci-install.sh "${{ matrix.constraints }}" "${{ matrix.python-version }}"
      - name: Full suite
        run: |
          source "$RUNNER_TEMP/mxz-venv/bin/activate"
          python -m pytest -p tools.pytest_phases tests/ -q -n auto --dist loadfile
      # The mode-change wait runs on time.monotonic (#32), which counts from boot: the
      # same suite again as if this runner had booted 120 s ago, below the hysteresis.
      # It runs after a failed suite too.
      - name: Full suite on a fresh-boot clock
        if: ${{ !cancelled() }}
        run: |
          source "$RUNNER_TEMP/mxz-venv/bin/activate"
          FAKE_UPTIME=120 python -m pytest -p tools.fakeboot -p tools.pytest_phases tests/ -q -n auto --dist loadfile
