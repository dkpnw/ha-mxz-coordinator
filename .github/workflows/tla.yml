name: TLA+ model check

# Not a required check. It reads only the spec and its runner, so it runs only when they
# change. tools/formal_tlc.py checks the jar's sha256 again, and says what each step proves.
on:
  push:
    branches:
      - main
    paths:
      - docs/formal/tla/**
      - tools/formal_tlc.py
      - .github/workflows/tla.yml
  pull_request:
    paths:
      - docs/formal/tla/**
      - tools/formal_tlc.py
      - .github/workflows/tla.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    name: TLC (MXZCoordinator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TLA2TOOLS_VERSION: "1.7.4"
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned tla2tools.jar
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v$TLA2TOOLS_VERSION/tla2tools.jar"
          printf '%s  %s\n' "$TLA2TOOLS_SHA256" "$RUNNER_TEMP/tla2tools.jar" | sha256sum --check --strict
          java -version
      - name: Every config, every reachability goal, every broken copy of the spec
        run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" python3 tools/formal_tlc.py all
