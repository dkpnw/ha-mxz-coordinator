name: release-provenance

# Attaches a source zip of custom_components/mxz_coordinator to an existing
# release, with a GitHub build-provenance attestation. It never creates a
# release or a tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the zip to (for example v3.18.0)
        required: true

permissions: {}

concurrency:
  group: release-provenance-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the tag has a release
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::bad tag '$TAG'"; exit 1;; esac
          gh release view "$TAG" --json tagName --jq .tagName
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build a deterministic source zip
        run: |
          mtime="$(git log -1 --format=%cI HEAD)"
          git archive --format=zip --mtime="$mtime" \
            -o mxz_coordinator.zip HEAD:custom_components/mxz_coordinator
          unzip -l mxz_coordinator.zip | tail -1
          sha256sum mxz_coordinator.zip | tee mxz_coordinator.zip.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mxz_coordinator.zip
      - name: Upload to the existing release
        run: gh release upload "$TAG" mxz_coordinator.zip mxz_coordinator.zip.sha256 --clobber
