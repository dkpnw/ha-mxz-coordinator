version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    # The per-lane HA constraint files are exact locks pinned by sha256 in CI;
    # they are regenerated deliberately, never bumped by Dependabot.
    exclude-paths:
      - "requirements/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The HA 2024.12.5 test plugin pins these exactly (pytest 8.3.3, pytest-asyncio
    # 0.24.0), so a raised floor cannot install in the minimum-HA lane (PR #108).
    # tests/test_dependabot_contract.py holds this list to the plugin's exact pins.
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-homeassistant-custom-component
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /requirements
    # Security updates reach these locks too (PR #90, pillow 13). The "/" entry's
    # exclude-paths does not stop them: GitHub documents it and
    # open-pull-requests-limit as version-updates only, and ignore as also applying
    # to security updates for this ecosystem and directory.
    # requirements/ha2026.10 holds no pip manifest, so it has no entry;
    # tests/test_dependabot_contract.py fails if a .txt lands in a subdirectory.
    ignore:
      - dependency-name: "*"
    schedule:
      interval: weekly
