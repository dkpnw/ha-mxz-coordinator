[tool.mypy]
strict = true
files = ["custom_components/mxz_coordinator"]
# custom_components/ has no __init__.py: name modules from the repository root.
explicit_package_bases = true

# Home Assistant imports these names into its public modules without listing them as
# exports, and the integration uses them from there. This covers HA only: the strict
# export rule still applies to custom_components.
[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true

[tool.coverage.run]
source = ["custom_components/mxz_coordinator"]
branch = true

[tool.coverage.report]
# Just under the measured total (96.48% on py3.14-ha2026.9.4). Raise it as coverage grows.
fail_under = 96
